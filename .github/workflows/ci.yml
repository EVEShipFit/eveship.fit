name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a changeset
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since="origin/$GITHUB_BASE_REF"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Require the ESI client ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ESI_CLIENT_ID_NEXT == ''
        run: echo "::error::Set the ESI_CLIENT_ID_NEXT repository variable" && exit 1

      - name: Set the version
        run: echo "EVESHIPFIT_VERSION=$(git describe --tags)" >> "$GITHUB_ENV"

      - name: Build website
        env:
          VITE_ESI_CLIENT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ESI_CLIENT_ID_NEXT || '' }}
        run: pnpm --filter @eveshipfit/web build

      - name: Test website end-to-end
        run: pnpm --filter @eveshipfit/web e2e

      - name: Build Storybook
        run: pnpm --filter @eveshipfit/storybook build

      - name: Upload website preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: apps/web/dist
          retention-days: 7

      - name: Upload Storybook preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-preview
          path: apps/storybook/dist
          retention-days: 7

      - name: Deploy next.eveship.fit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/web/wrangler.jsonc

      - name: Deploy storybook.eveship.fit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/storybook/wrangler.jsonc
