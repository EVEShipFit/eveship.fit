name: Production

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency: ${{ github.workflow }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the ESI client ID
        if: vars.ESI_CLIENT_ID_PRODUCTION == ''
        run: echo "::error::Set the ESI_CLIENT_ID_PRODUCTION repository variable" && exit 1

      - name: Build website
        env:
          EVESHIPFIT_VERSION: ${{ github.event.release.tag_name }}
          VITE_ESI_CLIENT_ID: ${{ vars.ESI_CLIENT_ID_PRODUCTION }}
        run: pnpm --filter @eveshipfit/web build

      - name: Deploy eveship.fit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/web/wrangler.jsonc --env production
